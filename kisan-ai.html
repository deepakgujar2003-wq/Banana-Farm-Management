<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖 Kisan Mitra AI • Banana G9 Expert</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f7f0;color:#202020}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}.head{background:#2e7d32;color:#fff;padding:13px 14px;position:sticky;top:0;z-index:5}.head h1{font-size:19px;margin:0}.head small{opacity:.9}.back{display:inline-block;color:#fff;text-decoration:none;margin-top:5px;font-size:12px}.context{margin:10px 12px 4px;padding:9px 11px;border-radius:10px;background:#fff8e1;font-size:12px;color:#5d4b00}.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px}.chip{white-space:nowrap;border:1px solid #b7d7b8;background:#f5fbf5;color:#1b5e20;border-radius:18px;padding:8px 11px;font-weight:700;font-size:12px}.chat{flex:1;padding:8px 12px 92px;overflow:auto}.msg{max-width:92%;padding:10px 12px;border-radius:14px;margin:7px 0;line-height:1.5;font-size:14px;white-space:pre-wrap}.ai{background:#e8f5e9;border-bottom-left-radius:4px}.user{background:#2e7d32;color:#fff;margin-left:auto;border-bottom-right-radius:4px}.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;z-index:10}.composer-in{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr auto auto;gap:7px}.composer textarea{resize:none;border:1px solid #bbb;border-radius:10px;padding:10px;font:14px Arial;min-height:44px;max-height:100px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.mic{background:#fff3e0;color:#e65100}.send{background:#2e7d32;color:#fff}.source{font-size:10px;color:#666;margin-top:8px}.safety{font-size:11px;background:#fff3e0;padding:9px;border-radius:9px;margin-top:8px;color:#5d3a00}@media(min-width:761px){body{padding:20px}.app{border-radius:16px;overflow:hidden;box-shadow:0 4px 20px #0002}.composer{position:sticky;bottom:0}}</style></head><body><div class="app"><header class="head"><h1>🤖 Kisan Mitra AI</h1><small>Smart Built-in Banana G9 Expert • बिना API Key</small><br><a class="back" href="index.html">← Farm App</a></header><div id="context" class="context"></div><div class="chips"><button class="chip" onclick="askChip('पीलापन है')">🟡 पीलापन</button><button class="chip" onclick="askChip('240 दिन की G9 फसल में bunch के लिए क्या करें')">🍌 240 दिन / Bunch</button><button class="chip" onclick="askChip('पत्तियों में धब्बे और करपा है')">🟤 धब्बे / करपा</button><button class="chip" onclick="askChip('खाद fertilizer का drip chart बताओ')">🌱 खाद</button><button class="chip" onclick="askChip('drip timing बताओ')">💧 Drip</button></div><main id="chat" class="chat"></main><div class="composer"><div class="composer-in"><textarea id="input" placeholder="जैसे: पीलापन क्यों है? 240 दिन में क्या दें? करपा का spray?" rows="1"></textarea><button class="btn mic" id="mic" onclick="startVoice()">🎙️</button><button class="btn send" onclick="sendMessage()">➤</button></div></div></div><script>const FARM='bananaFarm';const $=id=>document.getElementById(id);function farm(){let f={};try{f=JSON.parse(localStorage.getItem(FARM)||'{}')}catch(e){}let days=0;if(f.plantingDate){let d=new Date(f.plantingDate+'T00:00:00');if(!isNaN(d))days=Math.max(0,Math.floor((Date.now()-d.getTime())/86400000))}return{age:days,plants:Number(f.plants||0),area:f.area||'',unit:f.areaUnit||'',variety:f.variety||'G9 Banana'}}function renderContext(){let f=farm();$('context').textContent='🌿 '+f.variety+' • उम्र: '+f.age+' दिन'+(f.area?' • Area: '+f.area+' '+f.unit:'')+(f.plants?' • Plants: '+f.plants.toLocaleString('en-IN'):'')}function add(text,who,src){let d=document.createElement('div');d.className='msg '+who;d.textContent=text;if(src){let s=document.createElement('div');s.className='source';s.textContent=src;d.appendChild(s)}$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}function welcome(){add('राम राम किसान भाई 👨‍🌾\nअब मैं सवाल के keywords/intent के हिसाब से अलग-अलग G9 सलाह दूँगा। पीलापन, 240 दिन, bunch, धब्बे/करपा, खाद, drip, spray या कीट के बारे में सीधे पूछें।','ai','Smart Keyword Intent Matching')}function askChip(q){$('input').value=q;sendMessage()}function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('इस browser में Voice Typing उपलब्ध नहीं है। Chrome में try करें।');return}let r=new SR();r.lang='hi-IN';r.interimResults=false;r.maxAlternatives=1;$('mic').textContent='🔴';r.onresult=e=>{$('input').value=(e.results[0][0].transcript||'').trim();$('mic').textContent='🎙️'};r.onerror=()=>{$('mic').textContent='🎙️'};r.onend=()=>{$('mic').textContent='🎙️'};r.start()}function norm(q){return q.toLowerCase().replace(/[.,!?;:()\-]/g,' ').replace(/\s+/g,' ').trim()}function safety(){return'\n\n⚠️ सुरक्षा: दवा की formulation/label अलग हो सकती है। PPE पहनें, तेज हवा में spray न करें, बच्चों/पशुओं से दूर रखें और label/PHI का पालन करें। अलग pesticides को बिना compatibility के mix न करें।'}function answer(q){let x=norm(q),f=farm(),ageMatch=x.match(/\b(\d{2,3})\s*(दिन|day|days|d)?\b/),askedAge=ageMatch?Number(ageMatch[1]):f.age;if(/पीलापन|पीला|yellow|yellowing|chlorosis|iron|लोहतत्व|लोहा|जिंक|zinc|nitrogen|नाइट्रोजन/.test(x)){return'🟡 पत्तियों में पीलापन\n\nसबसे पहले देखें: पुरानी पत्तियां पहले पीली हैं तो N/Fe deficiency की संभावना; नई पत्तियां पीली लेकिन नसें हरी रहें तो Fe/Zn deficiency की संभावना बढ़ती है। मिट्टी का pH और सिंचाई भी जांचें।\n\n1) Ferrous Sulphate: 0.5% foliar spray = 5 ग्राम/लीटर पानी (100 L में 500 ग्राम) + Urea 1% = 10 ग्राम/लीटर (100 L में 1 kg), wetting agent के साथ।\n2) Zinc Sulphate: 0.5% = 5 ग्राम/लीटर (100 L में 500 ग्राम), अलग spray रखें।\n3) 19:19:19: label-allowed foliar concentration पर दें; इसे zinc sulphate/ferrous sulphate के साथ बिना compatibility पुष्टि के एक ही tank में न मिलाएं।\n\nअगर पीलापन बहुत तेज है, केवल fertilizer डालने के बजाय drainage, root health और मिट्टी/pH भी जांचें।'+safety()+'\n\nस्रोत: ICAR-NRCB banana recommendations.'}if(/240\s*दिन|240\s*d|8\s*महिने|8\s*महीने|8\s*month|bunch|घड़|घड़|बंच|flower|फूल|shooting/.test(x)||askedAge>=230&&askedAge<=270){return'🍌 240 दिन / लगभग 8 महीने / Bunch Stage\n\nइस अवस्था में potassium और bunch quality पर फोकस करें:\n\n1) 00:00:50 (Potassium Sulphate grade): banana orchard के लिए 15 ग्राम/लीटर पानी का foliar spray benchmark। 200 L tank = 3 kg.\n2) Bunch quality: last hand निकलने के लगभग 1 सप्ताह बाद 2% Potassium Sulphate = 20 ग्राम/लीटर पानी से bunch को अच्छी तरह drench करें; लगभग 30 दिन बाद दूसरा spray किया जा सकता है।\n3) Boron: deficiency/soil-test indication पर 0.05% boron = 0.5 ग्राम/लीटर foliar concentration।\n4) Bunch cover: last hand opening के बाद उचित ventilation वाला bunch cover लगाएं।\n5) इस stage पर nitrogen को अनावश्यक रूप से बहुत बढ़ाने के बजाय potassium, पानी की नियमितता और bunch support पर ध्यान दें।'+safety()+'\n\nस्रोत: ICAR/NRCB banana advisories.'}if(/धब्बे|धब्बा|दाग|करपा|sigatoka|सिगाटोका|leaf spot|leafspot|fungus|fungal|फंगस/.test(x)){return'🟤 धब्बे / करपा / Sigatoka Leaf Spot\n\nलक्षण: पत्तियों पर छोटे पीले-भूरे धब्बे, streak बनना और बाद में पत्ती का सूखना Sigatoka की तरफ संकेत कर सकता है।\n\nSpray options:\n1) Propiconazole 25 EC: 0.1% = 1 ml/लीटर पानी (100 L = 100 ml), पत्तियों की दोनों surfaces को अच्छी तरह cover करें।\n2) Carbendazim: 0.1% = 1 ग्राम/लीटर (100 L = 100 ग्राम) एक वैकल्पिक spray।\n3) एक ही fungicide को लगातार बार-बार न दोहराएं; rotation रखें।\n4) बहुत संक्रमित/सूखी पत्तियां हटाकर खेत से बाहर नष्ट करें और canopy में हवा का आवागमन रखें।'+safety()+'\n\nस्रोत: ICAR-NRCB leaf-spot recommendations.'}if(/खाद|fertilizer|fertiliser|urea|mop|19\s*[:.]?19|12\s*[:.]?61|0\s*[:.]?52|0\s*[:.]?50|npk|fertigation|fertigation chart/.test(x)){return'🌱 Banana G9 Drip Fertilizer Chart\n\nICAR-NRCB weekly fertigation benchmark (g/plant/application):\n\n• Week 9–18: Urea 15 g + MOP 8 g प्रति पौधा प्रति application\n• Week 19–30: Urea 10 g + MOP 10 g\n• Week 31–40: Urea 7 g + MOP 12 g\n• Week 41–46: Urea 0 g + MOP 10 g\n\nइस benchmark का total 340 g Urea + 375 g MOP प्रति plant है। Fertigation daily या weekly छोटे splits में की जा सकती है; drip में पहले साफ पानी, फिर fertilizer solution और अंत में line flushing करें।\n\nआपके app में 19:19:19, 12:61:00, 0:52:34 और 0:0:50 भी उपलब्ध हैं, लेकिन इन grades को ऊपर के Urea/MOP grams में सीधे बदलना सही नहीं होगा जब तक product analysis और target N-P-K मात्रा तय न हो। Grade बदलते समय label और soil/water test के अनुसार conversion करें।'+safety()+'\n\nस्रोत: ICAR-NRCB weekly fertigation schedule.'}if(/drip|सिंचाई|पानी|irrigation|water|timing|कब पानी/.test(x)){let a=askedAge;let w=a<=28?'1–4 सप्ताह: लगभग 4–6 L/plant/day benchmark':a<=63?'5–9 सप्ताह: लगभग 8–10 L/plant/day':a<=133?'10–19 सप्ताह: लगभग 12 L/plant/day':a<=224?'20–32 सप्ताह: लगभग 16–20 L/plant/day':a<=259?'33–37 सप्ताह: 20 L/plant/day या जरूरत के अनुसार':'38–50 सप्ताह: 20 L/plant/day या जरूरत के अनुसार';return'💧 Drip Timing\n\nआपकी crop age: '+a+' दिन\n\nICAR-NRCB stage benchmark: '+w+'.\n\nगर्मी/सूखे में छोटे और frequent events रखें; बारिश/भारी मिट्टी में interval बढ़ाएं। Waterlogging बिल्कुल न होने दें। Fertigation में साफ पानी → fertilizer solution → साफ पानी से flushing करें। Emitter discharge और मिट्टी के अनुसार daily runtime निकालना चाहिए।'+safety()+'\n\nस्रोत: ICAR-NRCB drip water requirement.'}if(/कीट|keet|pest|thrips|थ्रिप्स|aphid|माहू|weevil|घुन|nematode|नेमाटोड/.test(x)){return'🛡️ कीट/निदान\n\nपहले कीट का type पहचानें: Thrips में फूल/फलों पर scarring, Aphid में tender parts पर colony, weevil में corm/pseudostem damage और nematode में कमजोर roots/poor anchorage दिख सकता है।\n\nपहला कदम: प्रभावित पत्ते/कचरा हटाएं, field sanitation रखें, पानी का stress और excess nitrogen से बचें और नियमित monitoring करें।\n\nChemical spray तभी चुनें जब target pest + active ingredient + formulation स्पष्ट हो। Brand name देखकर dose अनुमान न लगाएं; label dose/PHI का पालन करें।'+safety()}if(/रोग|disease|विल्ट|wilt|पनामा|fusarium|सड़|rot|virus|वायरस/.test(x)){return'🩺 रोग निदान\n\nअगर पत्तियों पर धब्बे हैं तो Sigatoka/leaf spot intent देखें। अगर नीचे की पत्तियां पीली होकर plant wilt हो रहा है और pseudostem काटने पर vascular discoloration है तो Fusarium/Panama wilt की संभावना देखें। Soft/wet tissue और दुर्गंध हो तो rot की संभावना है।\n\nफोटो या लक्षण की जगह बताएं: नई/पुरानी पत्ती, जड़, pseudostem या bunch—तभी diagnosis और अगला कदम अधिक सटीक होगा। संक्रमित पौधे/मिट्टी की आवाजाही रोकना जरूरी है।'}if(/spray|स्प्रे|दवा|medicine|औषध/.test(x)){return'🧪 Spray सलाह\n\nपहले target बताएं: पीलापन, धब्बे/करपा, कीट, bunch या कोई दूसरा symptom। बिना target और formulation के एक ही दवा सब पर देना सही नहीं है।\n\nअगर Sigatoka है तो “धब्बे/करपा” लिखें; bunch stage है तो “240 दिन/bunch” लिखें; yellow leaves हैं तो “पीलापन” लिखें।'+safety()}if(/उम्र|age|कितने दिन|दिन का|month|महीना|आज क्या|current stage/.test(x)){let a=askedAge;return'📅 Crop Stage\n\nअभी दर्ज crop age: '+a+' दिन।\n'+(a<90?'Vegetative growth पर फोकस: balanced nutrition, drainage, weed control और नियमित drip.':a<180?'Rapid growth stage: N/K balance, micronutrient monitoring और irrigation consistency महत्वपूर्ण.':a<230?'Flower/shooting की तैयारी: potassium, irrigation और disease monitoring पर ध्यान दें.':'Bunch/shooting stage: potassium, bunch protection, support और disease monitoring प्राथमिकता रखें.')+'\n\nअगर exact काम पूछें—“240 दिन में क्या दें?”, “पीलापन”, “करपा”, “खाद”—तो उसी intent का अलग जवाब मिलेगा।'}return'❓ आपका सवाल समझने के लिए keyword बताएं: “पीलापन”, “240 दिन”, “bunch”, “धब्बे/करपा”, “Sigatoka”, “खाद”, “fertilizer”, “drip”, “कीट” या “spray”.\n\nअब generic 5-aadhar वाला जवाब repeat नहीं होगा; matching intent के अनुसार relevant सलाह मिलेगी।'}function sendMessage(){let q=$('input').value.trim();if(!q)return;add(q,'user');$('input').value='';setTimeout(()=>add(answer(q),'ai','Built-in Smart G9 Knowledge Base'),80)}$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});renderContext();welcome();</script></body></html>
