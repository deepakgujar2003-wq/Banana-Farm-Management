<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖 Kisan Mitra AI • Banana G9 Expert</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f7f0;color:#202020}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}.head{background:#2e7d32;color:#fff;padding:13px 14px;position:sticky;top:0;z-index:5}.head-row{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:19px;margin:0}.head small{opacity:.9}.back{display:inline-block;color:#fff;text-decoration:none;margin-top:5px;font-size:12px}.context{margin:10px 12px 4px;padding:9px 11px;border-radius:10px;background:#fff8e1;font-size:12px;color:#5d4b00}.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px}.chip{white-space:nowrap;border:1px solid #b7d7b8;background:#f5fbf5;color:#1b5e20;border-radius:18px;padding:8px 11px;font-weight:700;font-size:12px}.chat{flex:1;padding:8px 12px 92px;overflow:auto}.msg{max-width:90%;padding:10px 12px;border-radius:14px;margin:7px 0;line-height:1.5;font-size:14px;white-space:pre-wrap}.ai{background:#e8f5e9;border-bottom-left-radius:4px}.user{background:#2e7d32;color:#fff;margin-left:auto;border-bottom-right-radius:4px}.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;z-index:10}.composer-in{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr auto auto;gap:7px}.composer textarea{resize:none;border:1px solid #bbb;border-radius:10px;padding:10px;font:14px Arial;min-height:44px;max-height:100px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.mic{background:#fff3e0;color:#e65100}.send{background:#2e7d32;color:#fff}.source{font-size:10px;color:#666;margin-top:8px}.safety{font-size:11px;background:#fff3e0;padding:9px;border-radius:9px;margin-top:8px;color:#5d3a00}@media(min-width:761px){body{padding:20px}.app{border-radius:16px;overflow:hidden;box-shadow:0 4px 20px #0002}.composer{position:sticky;bottom:0}}</style></head><body><div class="app"><header class="head"><div class="head-row"><div><h1>🤖 Kisan Mitra AI</h1><small>Built-in Banana G9 Expert • बिना API Key</small></div><div>🌱</div></div><a class="back" href="index.html">← Farm App</a></header><div id="context" class="context"></div><div class="chips"><button class="chip" onclick="askChip('मेरी केले की फसल के लिए खाद का schedule बताओ')">🌱 Khad Schedule</button><button class="chip" onclick="askChip('केले में कीट या रोग की पहचान और नियंत्रण बताओ')">🛡️ Keet/Roga Nidan</button><button class="chip" onclick="askChip('घड़ निकलने के बाद केले में कौन सा spray करें?')">🍌 Bunch Spray</button><button class="chip" onclick="askChip('ड्रिप से खाद कब और कैसे दें?')">💧 Drip Timing</button><button class="chip" onclick="askChip('मेरी फसल की उम्र के हिसाब से अभी क्या करना चाहिए?')">📅 आज क्या करें?</button></div><main id="chat" class="chat"></main><div class="composer"><div class="composer-in"><textarea id="input" placeholder="बोलकर या टाइप करके पूछें..." rows="1"></textarea><button class="btn mic" id="mic" onclick="startVoice()">🎙️</button><button class="btn send" onclick="sendMessage()">➤</button></div></div></div><script>const FARM='bananaFarm';const $=id=>document.getElementById(id);const KB={fertilizer:{title:'G9 खाद/Fertigation',text:'Banana G9 में सामान्य पोषण प्रबंधन के लिए मिट्टी/पानी की जांच और स्थानीय सिफारिश को प्राथमिकता दें। एक व्यापक Grand Naine benchmark लगभग 200 kg N + 60 kg P2O5 + 300 kg K2O प्रति hectare प्रति crop है; इसे एक साथ न दें, बल्कि फसल की अवस्था के अनुसार छोटे-छोटे fertigation splits में दें। रोपाई के शुरुआती 0-30 दिन में जड़ जमना और संतुलित पोषण; 31-90 दिन में vegetative growth; 91-150 दिन में canopy और pseudostem development; 151 दिन से घड़/फूल अवस्था में potassium की जरूरत महत्वपूर्ण रहती है। पानी में घुलने वाले उर्वरक drip से देते समय अच्छी filtration, अलग-अलग fertilizer compatibility और पर्याप्त flushing रखें।'},drip:{title:'Drip Timing',text:'Banana में drip का उद्देश्य जड़ क्षेत्र में लगातार और समान नमी रखना है, पानी जमा करना नहीं। गर्म/सूखे मौसम में छोटे और अधिक frequent irrigation events बेहतर रहते हैं; ठंड/बरसात में interval बढ़ाएं और waterlogging से बचें। सुबह/दिन के ठंडे हिस्से में सिंचाई करना व्यावहारिक है। Fertigation के लिए पहले थोड़ी देर साफ पानी, फिर घुला fertilizer, और अंत में साफ पानी से line flush करें। खेत की मिट्टी, मौसम, emitter discharge और पौधे की अवस्था के बिना एक ही fixed मिनट सब खेतों के लिए सही नहीं होता।'},disease:{title:'रोग पहचान',text:'Sigatoka/leaf spot में पत्तियों पर छोटे पीले/भूरे धब्बे बढ़कर streak/necrosis बन सकते हैं और पुरानी पत्तियां जल्दी सूखती हैं। Panama/Fusarium wilt में नीचे की पत्तियां पीली पड़ना, मुरझाना और vascular discoloration जैसे लक्षण मिल सकते हैं; ऐसे पौधे को अलग रखें और संक्रमित मिट्टी/औजार की आवाजाही रोकें। Erwinia/soft rot में pseudostem/बंच के हिस्से में पानीदार नरमी, दुर्गंध या tissue breakdown हो सकता है। केवल text से निश्चित diagnosis नहीं होता—फोटो, पत्ते की स्थिति, खेत में फैलाव और जड़/pseudostem के लक्षण पूछना जरूरी है।'},pest:{title:'कीट नियंत्रण',text:'Banana में thrips से पत्तियों/फूल/फलों पर scarring और russeting, aphid से tender parts पर colonies तथा कभी-कभी virus spread, rhizome/corm weevil से कमजोर पौधे और bore holes, तथा nematode से जड़ें कमजोर होकर पौधे की growth प्रभावित हो सकती है। पहले निगरानी, प्रभावित हिस्से की सफाई, खेत की स्वच्छता, संतुलित सिंचाई और biological/IPM उपाय अपनाएं। रासायनिक नियंत्रण में active ingredient, formulation, target pest, crop stage और वर्तमान label के बिना exact dose नहीं गढ़ना चाहिए।'},bunch:{title:'Bunch/Spray Management',text:'घड़ निकलने के बाद bunch को चोट, thrips और अन्य fruit-surface pests से बचाना महत्वपूर्ण है। सूखे/रोगग्रस्त floral parts की स्वच्छता, सही bunch protection/bagging और खेत की निगरानी रखें। Spray चुनते समय target pest/disease और registered label देखें। अलग-अलग pesticides को बिना compatibility जानकारी के tank-mix न करें। कटाई से पहले PHI/label निर्देश अनिवार्य रूप से देखें।'},general:{title:'G9 General',text:'अच्छी G9 फसल के लिए 5 आधार: स्वस्थ planting material, अच्छी drainage, नियमित drip irrigation, soil/water-test आधारित nutrition और IPM आधारित pest/disease monitoring। फसल की अवस्था के अनुसार सलाह बदलती है; इसलिए plant age, मौसम, मिट्टी और लक्षण बताने पर उत्तर अधिक सटीक होगा।'}};function farmContext(){let f={};try{f=JSON.parse(localStorage.getItem(FARM)||'{}')}catch(e){}let days=0;if(f.plantingDate){let d=new Date(f.plantingDate+'T00:00:00');if(!isNaN(d))days=Math.max(0,Math.floor((Date.now()-d.getTime())/86400000))}return{variety:f.variety||'G9 Banana',ageDays:days,area:f.area||'',areaUnit:f.areaUnit||'',plants:Number(f.plants||0),plantingDate:f.plantingDate||''}}function renderContext(){let f=farmContext();$('context').textContent='🌿 Farm: '+f.variety+' • उम्र: '+f.ageDays+' दिन'+(f.area?' • Area: '+f.area+' '+f.areaUnit:'')+(f.plants?' • Plants: '+f.plants.toLocaleString('en-IN'):'')}function addMsg(text,who,source){let d=document.createElement('div');d.className='msg '+who;d.textContent=text;if(source){let s=document.createElement('div');s.className='source';s.textContent=source;d.appendChild(s)}$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}function welcome(){addMsg('राम राम किसान भाई 👨‍🌾\nमैं Kisan Mitra AI हूँ। अब मैं बिना API key के built-in Banana G9 knowledge base से जवाब देता हूँ।\n\nआप खाद, drip, spray, रोग/कीट, bunch और फसल की उम्र के हिसाब से काम पूछ सकते हैं।','ai','Built-in G9 Expert System')}function askChip(q){$('input').value=q;sendMessage()}function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('इस browser में Voice Typing उपलब्ध नहीं है। Chrome में try करें।');return}let r=new SR();r.lang='hi-IN';r.interimResults=false;r.maxAlternatives=1;$('mic').textContent='🔴';r.onresult=e=>{$('input').value=(e.results[0][0].transcript||'').trim();$('mic').textContent='🎙️'};r.onerror=()=>{$('mic').textContent='🎙️'};r.onend=()=>{$('mic').textContent='🎙️'};r.start()}function norm(s){return s.toLowerCase().replace(/[.,!?;:()]/g,' ')}function ageAdvice(){let a=farmContext().ageDays;if(a<=30)return'अभी 0-30 दिन की अवस्था है।\n• जड़ जमने और समान नमी पर ध्यान दें।\n• drip में पानी की कमी/अधिकता न होने दें।\n• मिट्टी-पानी जांच के आधार पर balanced nutrition शुरू करें।\n• कमजोर/मृत पौधे और शुरुआती कीट लक्षण रोज देखें।';if(a<=90)return'अभी 31-90 दिन की vegetative growth अवस्था है।\n• नियमित fertigation को छोटे splits में रखें।\n• पर्याप्त N और balanced nutrition के साथ K पर भी ध्यान दें।\n• पत्तियों में leaf-spot, thrips और aphid की weekly monitoring करें।\n• पानी जमा न होने दें।';if(a<=150)return'अभी 91-150 दिन की growth अवस्था है।\n• canopy और pseudostem मजबूत रखें।\n• fertigation को छोटे frequent splits में दें।\n• potassium की पर्याप्तता पर खास ध्यान दें।\n• रोग/कीट के शुरुआती लक्षण दिखते ही पहचान करें।';if(a<=210)return'अभी लगभग 151-210 दिन की अवस्था है।\n• घड़/फूल की स्थिति रोज देखें।\n• bunch protection और thrips/fruit-surface pest monitoring महत्वपूर्ण है।\n• पानी और potassium management संतुलित रखें।\n• chemical spray हो तो label और PHI जरूर देखें।';return'फसल 210+ दिन की है।\n• अब bunch development/harvest stage के अनुसार सलाह बदलती है।\n• bunch protection, रोग-कीट monitoring, irrigation और harvest planning पर ध्यान दें।\n• कटाई के पास कोई chemical use हो तो label PHI का कड़ाई से पालन करें।'}function answer(q){let x=norm(q);if(/खाद|fertil|urea|19 ?19|12 ?61|0 ?52|potash|पोटाश|npk|dap/.test(x)){return KB.fertilizer.text+'\n\nआपकी फसल: '+farmContext().ageDays+' दिन।\nअगर आप बताएं कि आपके पास कौन-सा fertilizer है (जैसे 19:19:19/12:61:00/0:0:50/Urea), कितना पानी या कितने पौधे हैं, तो मैं nutrient/quantity calculation कर सकता हूँ।'}if(/drip|ड्रिप|सिंच|पानी|irrigation/.test(x)){return KB.drip.text+'\n\nआपका plant age '+farmContext().ageDays+' दिन है। Exact मिनट निकालने के लिए emitter का discharge (L/hr), मिट्टी का प्रकार और मौसम बताएं।'}if(/sigatoka|सिगाटोका|leaf spot|पत्ती.*धब्ब|फ्यूज|panama|fusarium|erwinia|soft rot|सड़|गल|रोग|disease/.test(x)){return KB.disease.text+'\n\nअभी diagnosis के लिए बताएं: (1) कौन-सी पत्ती/भाग प्रभावित है, (2) धब्बे का रंग/आकार, (3) पौधे कितने दिन के हैं, (4) कितने पौधों में है, (5) जड़/pseudostem में क्या दिख रहा है। फोटो हो तो और बेहतर।'}if(/thrips|थ्रिप|aphid|एफिड|weevil|घुन|nematode|निमेटोड|कीट|pest|insect/.test(x)){return KB.pest.text+'\n\nकीट का सही नाम/फोटो, पौधे की उम्र और प्रभावित भाग बताएं। Chemical dose तभी बताऊँगा जब product का active ingredient + formulation और label-compatible target उपलब्ध हो।'}if(/bunch|घड़|गुच्छ|fruit|फल|spray|स्प्रे|छिड़क/.test(x)){return KB.bunch.text+'\n\nयदि आप product का नाम/active ingredient, formulation और tank में पानी (जैसे 200 L) बताएं तो label-based calculation में मदद कर सकता हूँ।'}if(/आज|अभी|age|उम्र|कितना.*दिन|क्या.*कर/.test(x))return ageAdvice();if(/kg|किलो|gram|ग्राम|litre|लीटर|ml|मिली|मात्रा|dose|डोज|कितना/.test(x)){return'मात्रा निकालने के लिए पहले 3 चीजें चाहिए: product/fertilizer का नाम, उसकी formulation या nutrient percentage, और पानी की मात्रा या कुल पौधे।\n\nसिर्फ नाम देखकर chemical dose बताना सुरक्षित नहीं है। मैं उपलब्ध जानकारी से per tank/per acre/per plant calculation कर सकता हूँ।'}return KB.general.text+'\n\nमैं इन विषयों पर सबसे अच्छा जवाब देता हूँ: खाद schedule, fertilizer quantity, drip timing, रोग पहचान, कीट नियंत्रण, bunch management और crop-age based काम। अपना सवाल थोड़ा विस्तार से लिखें—जैसे “मेरी फसल 120 दिन की है, पत्ती पर भूरे धब्बे हैं, क्या करूं?”'}async function sendMessage(){let input=$('input'),q=input.value.trim();if(!q)return;addMsg(q,'user');input.value='';let loading=addMsg('⏳ Built-in knowledge से जवाब तैयार हो रहा है...','ai');setTimeout(()=>{let a=answer(q);loading.textContent=a;let s=document.createElement('div');s.className='source';s.textContent='Built-in Banana G9 Expert System • General agronomy knowledge';loading.appendChild(s);$('chat').scrollTop=$('chat').scrollHeight},180)}$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});renderContext();welcome();</script></body></html>
