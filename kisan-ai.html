<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖 Kisan Mitra AI • Banana G9 Expert</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f7f0;color:#202020}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}.head{background:#2e7d32;color:#fff;padding:13px 14px;position:sticky;top:0;z-index:5}.headrow{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:19px;margin:0}.head small{opacity:.9}.back{display:inline-block;color:#fff;text-decoration:none;margin-top:5px;font-size:12px}.settings{border:0;background:#fff3e0;color:#5d3a00;border-radius:9px;padding:8px 10px;font-weight:700}.context{margin:10px 12px 4px;padding:9px 11px;border-radius:10px;background:#fff8e1;font-size:12px;color:#5d4b00}.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px}.chip{white-space:nowrap;border:1px solid #b7d7b8;background:#f5fbf5;color:#1b5e20;border-radius:18px;padding:8px 11px;font-weight:700;font-size:12px}.chat{flex:1;padding:8px 12px 92px;overflow:auto}.msg{max-width:92%;padding:10px 12px;border-radius:14px;margin:7px 0;line-height:1.5;font-size:14px;white-space:pre-wrap}.ai{background:#e8f5e9;border-bottom-left-radius:4px}.user{background:#2e7d32;color:#fff;margin-left:auto;border-bottom-right-radius:4px}.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;z-index:10}.composer-in{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr auto auto;gap:7px}.composer textarea{resize:none;border:1px solid #bbb;border-radius:10px;padding:10px;font:14px Arial;min-height:44px;max-height:100px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.mic{background:#fff3e0;color:#e65100}.send{background:#2e7d32;color:#fff}.source{font-size:10px;color:#666;margin-top:8px}.typing{opacity:.7;font-style:italic}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end;justify-content:center}.box{width:100%;max-width:760px;background:#fff;border-radius:18px 18px 0 0;padding:18px}.box h2{margin:0 0 12px;font-size:18px}.box input{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:14px}.box button{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;font-weight:700}.save{background:#2e7d32;color:#fff}.close{background:#eee}.hint{font-size:11px;color:#666;line-height:1.4;margin-top:9px}@media(min-width:761px){body{padding:20px}.app{border-radius:16px;overflow:hidden;box-shadow:0 4px 20px #0002}.composer{position:sticky;bottom:0}.modal{align-items:center}.box{border-radius:16px;margin:20px}}</style></head><body><div class="app"><header class="head"><div class="headrow"><div><h1>🤖 Kisan Mitra AI</h1><small>Real Gemini AI • Senior Banana G9 Agronomist</small></div><button class="settings" onclick="openSettings()">⚙️ Key</button></div><a class="back" href="index.html">← Farm App</a></header><div id="context" class="context"></div><div class="chips"><button class="chip" onclick="askChip('Banana plant bahut jhuk rahe hain, girne se kaise bachaye? Propping aur taar bandhai ka sahi tarika batao.')">🌴 पौधे झुक रहे</button><button class="chip" onclick="askChip('240 din ki G9 fasal me bunch ke liye ab kya karna chahiye?')">🍌 240 दिन / Bunch</button><button class="chip" onclick="askChip('Patton me dhabbe aur karpa hai, kya rog hai aur spray kya karu?')">🟤 धब्बे / करपा</button><button class="chip" onclick="askChip('G9 banana ka fertilizer drip chart batao')">🌱 खाद</button><button class="chip" onclick="askChip('Drip se banana ko kitna pani aur kitni baar dena chahiye?')">💧 Drip</button></div><main id="chat" class="chat"></main><div class="composer"><div class="composer-in"><textarea id="input" placeholder="कोई भी खेती का सवाल पूछें… जैसे पौधे झुक रहे हैं, हवा से कैसे बचाएं?" rows="1"></textarea><button class="btn mic" id="mic" onclick="startVoice()">🎙️</button><button class="btn send" onclick="sendMessage()">➤</button></div></div></div><div id="modal" class="modal"><div class="box"><h2>🔑 Gemini API Key</h2><input id="key" type="password" placeholder="AQ... अपनी Gemini API Key डालें"><div class="hint">Key इसी browser के LocalStorage में सेव होगी। Shared/public phone पर API key सेव न करें। Gemini model: <b>gemini-2.5-flash</b></div><button class="save" onclick="saveSettings()">Save & Start Gemini AI</button><button class="close" onclick="closeSettings()">Cancel</button></div></div><script>const FARM='bananaFarm',KEY='kisanGeminiKey';const $=id=>document.getElementById(id);function farm(){let f={};try{f=JSON.parse(localStorage.getItem(FARM)||'{}')}catch(e){}let days=0;if(f.plantingDate){let d=new Date(f.plantingDate+'T00:00:00');if(!isNaN(d))days=Math.max(0,Math.floor((Date.now()-d.getTime())/86400000))}return{age:days,plants:Number(f.plants||0),area:f.area||'',unit:f.areaUnit||'',variety:f.variety||'G9 Banana',village:f.village||''}}function renderContext(){let f=farm();$('context').textContent='🌿 '+f.variety+' • उम्र: '+f.age+' दिन'+(f.area?' • Area: '+f.area+' '+f.unit:'')+(f.plants?' • Plants: '+f.plants.toLocaleString('en-IN'):'')+(f.village?' • '+f.village:'')}function add(text,who,src){let d=document.createElement('div');d.className='msg '+who;d.textContent=text;if(src){let s=document.createElement('div');s.className='source';s.textContent=src;d.appendChild(s)}$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}function welcome(){let k=localStorage.getItem(KEY)||localStorage.getItem('gemini_api_key');add('राम राम किसान भाई 👨‍🌾\nअब आप कोई भी banana farming का सवाल सीधे पूछ सकते हैं। मैं Gemini AI के जरिए आपके सवाल का मतलब समझकर जमीन पर काम आने वाला जवाब दूँगा।\n\nउदाहरण: पौधे झुक रहे हैं, propping कैसे करें? आंधी आने वाली है क्या तैयारी करें? पीलापन क्यों है? 240 दिन में कौन सा पोषण दें?','ai',k?'Gemini AI • gemini-2.5-flash':'पहले ⚙️ Key में API Key डालें')}function openSettings(){$('key').value=localStorage.getItem(KEY)||localStorage.getItem('gemini_api_key')||'';$('modal').style.display='flex'}function closeSettings(){$('modal').style.display='none'}function saveSettings(){let k=$('key').value.trim();if(!k){alert('Gemini API Key डालें।');return}localStorage.setItem(KEY,k);localStorage.setItem('gemini_api_key',k);closeSettings();add('✅ Gemini API Key सेव हो गई। अब कोई भी खेती का सवाल पूछें।','ai','Gemini AI ready')}function askChip(q){$('input').value=q;sendMessage()}function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('इस browser में Voice Typing उपलब्ध नहीं है। Chrome में try करें।');return}let r=new SR();r.lang='hi-IN';r.interimResults=false;r.maxAlternatives=1;$('mic').textContent='🔴';r.onresult=e=>{$('input').value=(e.results[0][0].transcript||'').trim();$('mic').textContent='🎙️'};r.onerror=()=>{$('mic').textContent='🎙️'};r.onend=()=>{$('mic').textContent='🎙️'};r.start()}function systemPrompt(){let f=farm();return`आप Kisan Mitra AI हैं—भारत में banana/G9 खेती के लिए senior ground-level agronomist। किसान Hindi, Marathi, Hinglish या देसी भाषा में सवाल पूछ सकता है। हर सवाल का अर्थ context से समझो और सीधे उपयोगी जवाब दो। समस्या/संभावित कारण, फिर step-by-step कार्रवाई, और formulation भरोसेमंद होने पर ही साफ dose दो। Spray, soil application और fertigation अलग रखो। बिना प्रमाण के बीमारी/pesticide का नाम पक्का मत बताओ। Label dose/PHI और स्थानीय कृषि विभाग/ICAR-NRCB recommendation को प्राथमिकता दो। Chemical safety, PPE और मौसम संबंधी सावधानी बताओ। जवाब सरल Hindi/Hinglish, point-to-point और action-oriented रखो। किसान context: Variety=${f.variety}; Crop age=${f.age} days; Plants=${f.plants}; Area=${f.area} ${f.unit}; Village=${f.village}.`}async function callGemini(promptText){const apiKey=localStorage.getItem('gemini_api_key')?.trim();if(!apiKey){openSettings();throw new Error('API Key nahi mili. Upar Key button se save karein.')}const url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({contents:[{parts:[{text:promptText}]}]})});const data=await response.json();if(!response.ok){throw new Error(data.error?.message||'API Error')}return data.candidates?.[0]?.content?.parts?.[0]?.text||'Gemini ने कोई text response नहीं दिया।'}async function sendMessage(){let q=$('input').value.trim();if(!q)return;$('input').value='';add(q,'user');let typing=add('🤖 Gemini सोच रहा है...','ai');try{let answer=await callGemini(systemPrompt()+'\n\nकिसान का सवाल:\n'+q);typing.remove();add(answer,'ai','Gemini AI • gemini-2.5-flash')}catch(e){typing.remove();add('❌ Gemini Error: '+e.message,'ai','API connection')} }renderContext();welcome();$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});</script></body></html>
