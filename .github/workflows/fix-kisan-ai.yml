name: Fix Kisan AI integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Kisan AI markup and JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="kisan-ai-fab-style">
          #kisanAiFab{position:fixed;right:16px;bottom:82px;z-index:45;width:62px;height:62px;border:0;border-radius:50%;background:#2e7d32;color:#fff;box-shadow:0 4px 14px #0004;font-size:29px;cursor:pointer;display:flex;align-items:center;justify-content:center}
          #kisanAiFab:active{transform:scale(.96)}
          #kisanAiModal{display:none;position:fixed;inset:0;z-index:100;background:#f4f7f2}
          #kisanAiModal.active{display:block}
          #kisanAiModal iframe{width:100%;height:100%;border:0;display:block}
          #kisanAiClose{position:absolute;right:10px;top:10px;z-index:102;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#333;font-size:24px;font-weight:bold;box-shadow:0 2px 10px #0004;cursor:pointer}
          @media(min-width:700px){#kisanAiFab{right:24px;bottom:86px}}
          </style>'''
          s=re.sub(r'<style id="kisan-ai-fab-style">.*?</style>', '', s, count=1, flags=re.S)
          s=s.replace('</head>', css+'</head>', 1)
          s=re.sub(r'<button id="kisanAiFab".*?</div>', '', s, count=1, flags=re.S)
          # The pattern above removes button plus modal through its first closing div; replace any remaining modal block safely.
          s=re.sub(r'<div id="kisanAiModal".*?</div>', '', s, count=1, flags=re.S)
          ui='<button id="kisanAiFab" type="button" aria-label="Open Kisan Mitra AI" onclick="openKisanAI()">🤖</button><div id="kisanAiModal" aria-hidden="true"><button id="kisanAiClose" type="button" aria-label="Close Kisan Mitra AI" onclick="closeKisanAI()">×</button><iframe id="kisanAiFrame" title="Kisan Mitra AI" src="kisan-ai.html"></iframe></div>'
          s=s.replace('<body>', '<body>'+ui, 1)
          js='''function openKisanAI(){var m=document.getElementById('kisanAiModal');if(!m)return;m.classList.add('active');m.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeKisanAI(){var m=document.getElementById('kisanAiModal');if(!m)return;m.classList.remove('active');m.setAttribute('aria-hidden','true');document.body.style.overflow=''}document.addEventListener('keydown',function(e){if(e.key==='Escape')closeKisanAI()});'''
          # Remove malformed nested integration script if present.
          s=re.sub(r'<script id="kisan-ai-integration-script">.*?</script>', '', s, count=1, flags=re.S)
          s=s.replace('</script></body></html>', js+'</script></body></html>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Kisan AI button integration"
          git push
