name: Update Gemini API call
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Gemini function
        shell: python
        run: |
          from pathlib import Path
          p=Path('kisan-ai.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function gemini(q){')
          end=s.find('async function sendMessage', start)
          if start < 0 or end < 0:
              raise SystemExit('Gemini function boundary not found')
          new="""async function gemini(q){
const apiKey=(localStorage.getItem('gemini_api_key')||localStorage.getItem(KEY)||'').trim();
let model=(localStorage.getItem('gemini_model')||localStorage.getItem(MODELKEY)||'gemini-1.5-flash').trim();
model=model.replace(/^models\\//,'');
if(!apiKey){openSettings();throw new Error('पहले Gemini API Key डालें।')}
const userPrompt=systemPrompt()+'\\n\\nकिसान का सवाल:\\n'+q;
const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
const res=await fetch(endpoint,{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({contents:[{parts:[{text:userPrompt}]}]})
});
const data=await res.json();
if(!res.ok){throw new Error(data.error?.message||'API request failed')}
return data.candidates[0].content.parts[0].text;
}
"""
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kisan-ai.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Kisan Mitra Gemini API call"
          git push