name: Fix Main App HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix index HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '</style></head>' not in s and '</head>' in s:
              s = s.replace('</head>', '</style></head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-index-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix main app HTML style closing tag' || exit 0
          git push