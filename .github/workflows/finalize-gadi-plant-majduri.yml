name: Finalize Gadi Plant Majduri
on:
  push:
    paths:
      - .github/workflows/finalize-gadi-plant-majduri.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make plant-based Gadi labels explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('🍌 Kul Ghad (Total Bunches)</span>','🍌 Total Harvested Plants (Ghad)</span>',1)
          s=s.replace('<th>Total Ghad</th><th>NET WT</th>','<th>Harvested Plants</th><th>NET WT</th>',1)
          s=s.replace('(Harvested Plants × ₹/Plant)','(Total Harvested Plants × ₹/Plant)',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Clarify Gadi plant based harvest labour'
          git push
